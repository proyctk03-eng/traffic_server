name: CI Test & Static Demo Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium for UI E2E tests
        run: npx playwright install chromium

      - name: Run time distribution tests
        run: node test_distribution.js

      - name: Run unit & integration tests
        run: npm test

      - name: Run commercial E2E test suite
        run: node e2e_tests/run_all_tests.js

      - name: Build static demo bundle
        run: npm run build:demo
