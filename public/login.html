<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Đăng nhập - Traffic Control System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-canvas: #090d16;
            --bg-surface: #111827;
            --bg-surface-hover: #1e293b;
            --border-hairline: rgba(148, 163, 184, 0.14);
            --border-focus: rgba(99, 102, 241, 0.55);
            --cta-from: #4f46e5;
            --cta-to: #06b6d4;
            --emerald: #10b981;
            --emerald-bright: #34d399;
            --danger: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --radius: 16px;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .bg-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.7; }
        .orb-1 { width: 460px; height: 460px; background: radial-gradient(circle, rgba(79, 70, 229, 0.22), transparent 70%); top: -180px; left: -160px; }
        .orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(6, 182, 212, 0.16), transparent 70%); bottom: -160px; right: -140px; }
        .particles { position: absolute; inset: 0; pointer-events: none; }
        .particle { position: absolute; border-radius: 50%; opacity: 0; animation: particleFly linear infinite; }
        @keyframes particleFly {
            0% { opacity: 0; transform: translateY(0) scale(0); }
            15% { opacity: 0.65; }
            85% { opacity: 0.25; }
            100% { opacity: 0; transform: translateY(-110vh) scale(1.6); }
        }

        /* Streamlined 1-row top bar */
        .top-nav {
            position: relative;
            z-index: 10;
            max-width: 1120px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .brand-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.02em;
        }
        .brand-badge {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--cta-from), var(--cta-to));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            border-radius: 9px;
            background: var(--bg-surface-hover);
            border: 1px solid var(--border-hairline);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .nav-pill:hover {
            color: var(--text-primary);
            border-color: rgba(148, 163, 184, 0.3);
            transform: translateY(-1px);
        }
        .nav-pill.accent {
            background: rgba(6, 182, 212, 0.12);
            border-color: rgba(6, 182, 212, 0.32);
            color: #67e8f9;
        }

        .login-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px 36px;
            position: relative;
            z-index: 10;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius);
            padding: 32px 30px;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.55);
        }
        .login-logo { text-align: center; margin-bottom: 26px; }
        .logo-icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 62px;
            height: 62px;
            background: linear-gradient(135deg, var(--cta-from), var(--cta-to));
            border-radius: 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 26px rgba(79, 70, 229, 0.35);
        }
        .logo-icon-wrap i { font-size: 26px; color: #fff; }
        .login-logo h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 5px;
        }
        .login-logo .subtitle { color: var(--text-secondary); font-size: 13px; }
        .live-clock {
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: #67e8f9;
        }

        .form-group { margin-bottom: 16px; }
        label.field-label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 7px;
        }
        label.field-label i { margin-right: 6px; color: #818cf8; font-size: 12px; }
        .input-wrap { position: relative; }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--bg-canvas);
            border: 1px solid var(--border-hairline);
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18);
        }
        input::placeholder { color: var(--text-muted); }
        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            padding: 4px;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--text-primary); }

        /* Toggle switch */
        .toggle-switch {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .toggle-switch input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            width: 38px;
            height: 22px;
            border-radius: 999px;
            background: var(--bg-surface-hover);
            border: 1px solid var(--border-hairline);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            flex-shrink: 0;
            outline: none;
        }
        .toggle-switch input[type="checkbox"]::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #cbd5e1;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .toggle-switch input[type="checkbox"]:checked {
            background: linear-gradient(135deg, var(--cta-from), var(--cta-to));
            border-color: transparent;
        }
        .toggle-switch input[type="checkbox"]:checked::after {
            transform: translateX(16px);
            background: #ffffff;
        }
        .toggle-switch input[type="checkbox"]:focus-visible {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.35);
        }

        .error-box {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 10px;
            padding: 11px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 500;
        }
        .error-box.shake { animation: shake 0.35s ease; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }

        .btn-login {
            width: 100%;
            padding: 13px 16px;
            background: linear-gradient(135deg, var(--cta-from), var(--cta-to));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 6px;
            transition: transform 0.18s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.28);
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(6, 182, 212, 0.28);
        }
        .btn-login:active:not(:disabled) { transform: translateY(0) scale(0.99); }
        .btn-login:disabled,
        .btn-login.is-loading {
            opacity: 0.75;
            cursor: wait;
        }

        .divider {
            text-align: center;
            margin: 22px 0 14px;
            color: var(--text-muted);
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-hairline);
        }
        .quick-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-boost-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--bg-surface-hover);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #67e8f9;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-boost-link:hover {
            background: rgba(6, 182, 212, 0.12);
            transform: translateY(-1px);
        }
        .sub-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 12.5px;
            margin-top: 4px;
        }
        .sub-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .sub-links a:hover { color: var(--text-primary); }
        .version-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 11.5px;
            color: var(--text-muted);
        }
        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--emerald);
            box-shadow: 0 0 8px var(--emerald);
        }
    </style>
</head>
<body>
    <div class="bg-scene">
        <div class="bg-grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="particles" id="particles"></div>
    </div>

    <header class="top-nav">
        <a href="/" class="brand-link">
            <span class="brand-badge"><i class="fa-solid fa-bolt-lightning"></i></span>
            <span>Traffic Control</span>
        </a>
        <nav class="nav-links" aria-label="Điều hướng">
            <a href="/" class="nav-pill"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
            <a href="/boost" class="nav-pill accent"><i class="fa-solid fa-rocket"></i> Boost</a>
            <a href="/order.html" class="nav-pill"><i class="fa-solid fa-cart-plus"></i> Đặt đơn</a>
            <a href="/track.html" class="nav-pill"><i class="fa-solid fa-magnifying-glass"></i> Tra cứu</a>
        </nav>
    </header>

    <main class="login-stage">
        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-logo">
                    <div class="logo-icon-wrap"><i class="fa-solid fa-shield-halved"></i></div>
                    <h1>Traffic Control System</h1>
                    <div class="subtitle">Xác thực quản trị hệ thống (REQUIRE_AUTH=true)</div>
                    <div class="live-clock" id="live-clock">--:--:--</div>
                </div>

                <div class="error-box" id="error-box">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span id="error-text">Tài khoản hoặc mật khẩu không chính xác.</span>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label class="field-label" for="username"><i class="fa-solid fa-user-shield"></i> Tên đăng nhập</label>
                        <input type="text" id="username" placeholder="Nhập tài khoản admin" required autofocus autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label class="field-label" for="password"><i class="fa-solid fa-lock"></i> Mật khẩu</label>
                        <div class="input-wrap">
                            <input type="password" id="password" placeholder="Nhập mật khẩu" required autocomplete="current-password" style="padding-right: 44px;">
                            <button type="button" class="toggle-pw" id="toggle-pw" tabindex="-1" aria-label="Hiện/ẩn mật khẩu">
                                <i class="fa-solid fa-eye" id="pw-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
                        <label class="toggle-switch" for="remember-me">
                            <input type="checkbox" id="remember-me" checked>
                            <span>Ghi nhớ mật khẩu</span>
                        </label>
                    </div>
                    <button type="submit" class="btn-login" id="login-btn">
                        <i class="fa-solid fa-right-to-bracket" id="login-icon"></i>
                        <span id="login-text">Đăng nhập hệ thống</span>
                    </button>
                </form>

                <div class="divider">Truy cập nhanh không cần tài khoản</div>
                <div class="quick-links">
                    <a href="/boost" class="btn-boost-link">
                        <i class="fa-solid fa-bolt"></i>
                        <span>Mở trang Tăng Traffic /boost</span>
                    </a>
                    <div class="sub-links">
                        <a href="/order.html">Đặt đơn lẻ</a>
                        <a href="/track.html">Tra cứu đơn</a>
                    </div>
                </div>

                <div class="version-badge">
                    <div class="badge-dot"></div>
                    <span>Traffic Engine v2.0 &bull; Online</span>
                </div>
            </div>
        </div>
    </main>

    <script src="js/login.js"></script>
    <script>
        function updateClock() {
            var clockEl = document.getElementById('live-clock');
            if (clockEl) clockEl.textContent = new Date().toLocaleString('vi-VN');
        }
        updateClock();
        setInterval(updateClock, 1000);

        var pwInput = document.getElementById('password');
        var pwIcon = document.getElementById('pw-icon');
        var togglePwBtn = document.getElementById('toggle-pw');
        if (togglePwBtn && pwInput && pwIcon) {
            togglePwBtn.addEventListener('click', function () {
                var isText = pwInput.type === 'text';
                pwInput.type = isText ? 'password' : 'text';
                pwIcon.className = isText ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
            });
        }

        var pc = document.getElementById('particles');
        if (pc) {
            function createParticle() {
                if (pc.children.length > 6) return;
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = (Math.random() * 100) + 'vw';
                p.style.bottom = '-10px';
                var dur = 8 + Math.random() * 7;
                p.style.animationDuration = dur + 's';
                var size = 2 + Math.random() * 2;
                p.style.width = p.style.height = size + 'px';
                var colors = ['#4f46e5', '#06b6d4', '#10b981'];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                pc.appendChild(p);
                setTimeout(function () { p.remove(); }, (dur + 1) * 1000);
            }
            setInterval(createParticle, 1800);
            for (var i = 0; i < 3; i++) { createParticle(); }
        }
    </script>
</body>
</html>
